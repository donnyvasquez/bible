<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronos Biblia - Línea de Tiempo Interactiva</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide-up { animation: slideUp 0.7s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden-illustration { display: none; }
        
        /* Pantalla de carga */
        #loader-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-40">

    <!-- Pantalla de Carga Inicial -->
    <div id="loader-screen">
        <div class="spinner"></div>
        <p class="mt-4 text-indigo-900 font-bold tracking-widest text-sm">CARGANDO CRONOS BIBLIA...</p>
    </div>

    <!-- Contenedor Principal -->
    <div id="app-root" style="display: none;"></div>

    <!-- Mensaje de Error (Oculto por defecto) -->
    <div id="error-message" class="hidden fixed inset-0 z-50 bg-white flex items-center justify-center p-8 text-center">
        <div class="max-w-md">
            <h2 class="text-2xl font-bold text-red-600 mb-2">Error de Datos</h2>
            <p class="text-slate-600" id="error-text">No se pudo cargar el archivo de datos.</p>
        </div>
    </div>

    <!-- 1. IMPORTAR DATOS EXTERNOS -->
    <script src="bibleData.js"></script>

    <!-- 2. LÓGICA DE LA APLICACIÓN -->
    <script>
        // Configuración de la App
        const APP_REQUIRED_DATA_VERSION = "1.0"; 
        const apiKey = ""; 
        const illustrationHiddenClass = "hidden"; 

        // Estado Global
        let state = {
            activeBookIndex: 0,
            viewMode: 'book',
            selectedEvent: null,
            eventImages: {},
            isGenerating: {},
            customInstructions: {}
        };

        // Verificación de Datos al Iniciar
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader-screen');
            const appRoot = document.getElementById('app-root');
            const errorScreen = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // 1. Verificar si bibleData existe
            if (typeof window.bibleData === 'undefined' || !Array.isArray(window.bibleData)) {
                loader.style.display = 'none';
                errorScreen.classList.remove('hidden');
                errorText.textContent = "El archivo 'bibleData.js' no se encuentra o está dañado. Asegúrate de que esté en la misma carpeta.";
                return;
            }

            // 2. Verificar Versión
            if (window.BIBLE_DATA_VERSION !== APP_REQUIRED_DATA_VERSION) {
                console.warn(`Versión de datos (${window.BIBLE_DATA_VERSION}) difiere de la requerida (${APP_REQUIRED_DATA_VERSION}).`);
                // Podrías bloquear la carga aquí, pero usualmente mostramos una advertencia
            }

            // 3. Iniciar App
            setTimeout(() => {
                loader.style.display = 'none';
                appRoot.style.display = 'block';
                renderApp();
            }, 500); // Pequeño delay estético
        });

        // --- LÓGICA DE RENDERIZADO ---
        
        function renderApp() {
            const root = document.getElementById('app-root');
            root.innerHTML = ''; 

            const currentBook = window.bibleData[state.activeBookIndex]; // Usamos window.bibleData

            // A. Navegadores
            const navHTML = `
                <div class="hidden lg:flex fixed inset-y-0 left-0 items-center px-4 z-40">
                    <button onclick="changeBook(${Math.max(0, state.activeBookIndex - 1)})" ${state.activeBookIndex === 0 || state.viewMode === 'general' ? 'disabled style="opacity:0.1"' : ''} class="w-16 h-16 rounded-[2rem] bg-white shadow-2xl flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all border border-slate-100 group"><i data-lucide="chevron-left" class="w-8 h-8"></i></button>
                </div>
                <div class="hidden lg:flex fixed inset-y-0 right-0 items-center px-4 z-40">
                    <button onclick="changeBook(${Math.min(window.bibleData.length - 1, state.activeBookIndex + 1)})" ${state.activeBookIndex === window.bibleData.length - 1 || state.viewMode === 'general' ? 'disabled style="opacity:0.1"' : ''} class="w-16 h-16 rounded-[2rem] bg-white shadow-2xl flex items-center justify-center hover:bg-indigo-600 hover:text-white transition-all border border-slate-100 group"><i data-lucide="chevron-right" class="w-8 h-8"></i></button>
                </div>
            `;

            // B. Header
            const headerHTML = `
                <header class="bg-indigo-950 text-white p-6 shadow-xl sticky top-0 z-50">
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg rotate-3"><i data-lucide="map" class="w-7 h-7"></i></div>
                            <h1 class="text-3xl font-black uppercase italic tracking-tighter">Cronos <span class="text-indigo-400">Biblia</span></h1>
                        </div>
                        <nav class="flex gap-2 p-1.5 bg-indigo-900/50 rounded-2xl border border-white/5">
                            <button onclick="setViewMode('book')" class="px-8 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${state.viewMode === 'book' ? 'bg-white text-indigo-950 shadow-lg' : 'text-indigo-200 hover:text-white'}">Libro a Libro</button>
                            <button onclick="setViewMode('general')" class="px-8 py-3 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${state.viewMode === 'general' ? 'bg-white text-indigo-950 shadow-lg' : 'text-indigo-200 hover:text-white'}">Línea Global</button>
                        </nav>
                    </div>
                </header>
            `;

            // C. Main Content
            let mainHTML = `<main class="max-w-7xl mx-auto p-4 md:p-10 fade-in">`;

            if (state.viewMode === 'book') {
                mainHTML += `
                    <div class="bg-white rounded-[3rem] p-12 shadow-2xl border mb-20 relative overflow-hidden slide-up">
                        <div class="relative z-10 space-y-6">
                            <span class="bg-indigo-600 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">${currentBook.period}</span>
                            <h2 class="text-7xl font-black text-slate-900 tracking-tighter leading-none">${currentBook.title}</h2>
                            <p class="text-2xl text-slate-500 max-w-3xl font-medium">${currentBook.description}</p>
                        </div>
                    </div>
                    <div class="relative ml-4 md:ml-24 border-l-4 border-indigo-100 space-y-32 pb-20">
                        ${currentBook.events.map(ev => `
                            <div class="relative pl-12 md:pl-24 group slide-up">
                                <div class="absolute -left-[20px] top-8 w-10 h-10 rounded-full bg-white border-[8px] border-indigo-600 shadow-xl z-20 group-hover:scale-110 transition-transform"></div>
                                <div class="lg:col-span-12 bg-white rounded-[2.5rem] p-10 shadow-xl border cursor-pointer hover:shadow-2xl transition-all" onclick="openModal('${ev.id}')">
                                    <div class="flex justify-between items-center mb-6">
                                        <div class="flex items-center gap-3">
                                            <span class="bg-indigo-50 text-indigo-700 px-5 py-1.5 rounded-full text-xs font-black tracking-widest">${ev.date}</span>
                                            <span class="flex items-center gap-1.5 text-slate-400 text-[10px] font-bold uppercase"><i data-lucide="scroll-text" class="w-3 h-3"></i> ${ev.scriptureDisplay || ''}</span>
                                        </div>
                                    </div>
                                    <h3 class="text-4xl font-black mb-6 text-slate-800 tracking-tight">${ev.title}</h3>
                                    <p class="text-xl text-slate-500 leading-relaxed mb-8">${ev.description}</p>
                                    <button class="w-full py-5 bg-indigo-600 text-white rounded-[1.2rem] font-black text-xs uppercase tracking-[0.2em]">Explorar y Estudiar</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                mainHTML += `
                    <div class="text-center mb-16 slide-up">
                        <h2 class="text-6xl font-black text-indigo-950 tracking-tighter mb-4">Mapa de la Redención</h2>
                        <p class="text-slate-500 text-xl font-medium">Un viaje a través de los siglos e hitos bíblicos.</p>
                        <p class="text-xs text-slate-400 font-bold mt-4 uppercase">Vista Global Activa</p>
                    </div>
                    <div class="relative max-w-5xl mx-auto">
                        <div class="absolute left-1/2 -translate-x-1/2 top-0 bottom-0 w-1 bg-indigo-100 hidden md:block"></div>
                        <div class="space-y-24 relative">
                            ${window.bibleData.map((book, bIdx) => `
                                <div class="relative">
                                    <div class="sticky top-28 z-30 flex justify-center mb-10">
                                        <span class="px-8 py-2.5 bg-indigo-950 text-white rounded-xl text-[10px] font-black uppercase tracking-[0.3em] shadow-2xl border-4 border-white">${book.title}</span>
                                    </div>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-24">
                                        ${book.events.map((ev, eIdx) => `
                                            <div onclick="jumpToEvent(${bIdx}, '${ev.id}')" class="group relative bg-white p-8 rounded-[2.5rem] border shadow-md hover:shadow-2xl transition-all cursor-pointer ${eIdx % 2 !== 0 ? 'md:translate-y-16' : ''}">
                                                <div class="flex flex-col gap-4">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full">${ev.date}</span>
                                                        <i data-lucide="scroll-text" class="w-4 h-4 text-slate-300"></i>
                                                    </div>
                                                    <h4 class="text-2xl font-black text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">${ev.title}</h4>
                                                    <p class="text-slate-500 text-sm leading-relaxed line-clamp-3">${ev.description}</p>
                                                    
                                                    <div class="${illustrationHiddenClass} mt-4 aspect-[2/1] rounded-2xl overflow-hidden border">
                                                       ${state.eventImages[ev.id] ? `<img src="${state.eventImages[ev.id]}" class="w-full h-full object-cover">` : ''}
                                                    </div>
                                                    <div class="pt-4 border-t border-slate-50 flex items-center justify-between text-[10px] font-black text-indigo-400 uppercase tracking-widest">
                                                        <span>Ver Estudio Completo</span>
                                                        <i data-lucide="chevron-right" class="w-3 h-3"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            mainHTML += `</main>`;

            // D. Footer
            const footerHTML = `
                <footer class="fixed bottom-0 w-full bg-white/90 backdrop-blur-xl border-t border-slate-200 p-8 z-[60]">
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-8">
                        <div class="flex-1 flex items-center gap-6">
                            <div class="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden border">
                                <div class="bg-indigo-600 h-full transition-all duration-1000" style="width: ${((state.activeBookIndex + 1) / window.bibleData.length) * 100}%"></div>
                            </div>
                            <span class="text-xs font-black text-indigo-900 whitespace-nowrap">${Math.round(((state.activeBookIndex + 1) / window.bibleData.length) * 100)}%</span>
                        </div>
                        <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-[1.5rem] border">
                            <button onclick="changeBook(${Math.max(0, state.activeBookIndex - 1)})" ${state.activeBookIndex === 0 ? 'disabled style="opacity:0.2"' : ''} class="w-12 h-12 flex items-center justify-center bg-white rounded-xl shadow-md transition-all"><i data-lucide="chevron-left"></i></button>
                            <div class="px-8 text-center min-w-[180px]">
                                <p class="text-lg font-black text-slate-800">${currentBook.title}</p>
                            </div>
                            <button onclick="changeBook(${Math.min(window.bibleData.length - 1, state.activeBookIndex + 1)})" ${state.activeBookIndex === window.bibleData.length - 1 ? 'disabled style="opacity:0.2"' : ''} class="w-12 h-12 flex items-center justify-center bg-white rounded-xl shadow-md transition-all"><i data-lucide="chevron-right"></i></button>
                        </div>
                    </div>
                </footer>
            `;

            root.innerHTML = navHTML + headerHTML + mainHTML + footerHTML;

            if (state.selectedEvent) {
                renderModal(root);
            }

            lucide.createIcons();
        }

        // --- RENDERIZADO DEL MODAL ---
        function renderModal(rootElement) {
            const ev = state.selectedEvent;
            const book = window.bibleData.find(b => b.events.some(e => e.id === ev.id));
            const hasImg = state.eventImages[ev.id];
            const gen = state.isGenerating[ev.id];

            const modalHTML = `
                <div class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md fade-in">
                    <div class="bg-white rounded-[2.5rem] shadow-2xl max-w-4xl w-full max-h-[92vh] overflow-hidden flex flex-col border border-slate-200">
                        <div class="p-6 border-b flex justify-between items-center bg-indigo-50/50">
                            <div class="flex items-center gap-4">
                                <div class="bg-indigo-600 p-2.5 rounded-2xl shadow-lg shadow-indigo-200"><i data-lucide="scroll-text" class="w-6 h-6 text-white"></i></div>
                                <div>
                                    <p class="text-indigo-600 font-bold text-xs uppercase tracking-[0.2em]">${ev.date || 'Fecha por definir'}</p>
                                    <h2 class="text-2xl font-black text-slate-800 flex items-center gap-2">${ev.title}</h2>
                                </div>
                            </div>
                            <button onclick="closeModal()" class="p-3 hover:bg-slate-200 rounded-full transition-all text-slate-400 hover:text-indigo-600"><i data-lucide="x" class="w-6 h-6"></i></button>
                        </div>

                        <div class="p-8 overflow-y-auto custom-scrollbar">
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <div class="lg:col-span-7 space-y-8">
                                    <div class="${illustrationHiddenClass} aspect-video bg-slate-100 rounded-[2rem] overflow-hidden border-2 border-slate-200 flex items-center justify-center relative shadow-inner">
                                        ${hasImg ? 
                                            `<img src="${hasImg}" class="w-full h-full object-cover" alt="${ev.title}">` : 
                                            `<div class="text-center p-6"><i data-lucide="image" class="w-8 h-8 text-indigo-300 mx-auto mb-4"></i>
                                             <button onclick="generateImage('${ev.id}')" class="px-6 py-2.5 bg-indigo-600 text-white rounded-full text-xs font-black uppercase">
                                                ${gen ? 'Generando...' : 'Generar Ilustración IA'}
                                             </button></div>`
                                        }
                                    </div>

                                    <div class="space-y-4">
                                        <div class="flex items-center gap-2 text-indigo-900 font-black text-xs uppercase tracking-widest"><i data-lucide="quote" class="w-4 h-4"></i> Contexto del Hito</div>
                                        <p class="text-xl text-slate-700 leading-relaxed font-medium italic border-l-4 border-indigo-100 pl-6">"${ev.details.intro}"</p>
                                        <div class="grid grid-cols-1 gap-3 mt-6">
                                            ${ev.details.items.map((it, i) => `
                                                <div class="flex gap-4 items-start bg-slate-50/50 p-4 rounded-2xl border border-slate-100">
                                                    <div class="w-8 h-8 bg-white border-2 border-indigo-600 text-indigo-600 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-black">${i + 1}</div>
                                                    <span class="text-slate-600 font-medium pt-1">${it}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>

                                <div class="lg:col-span-5 space-y-6">
                                    <div class="bg-white rounded-3xl p-6 border-2 border-indigo-50 shadow-sm">
                                        <div class="flex items-center gap-3 mb-4 text-indigo-600"><i data-lucide="scroll-text" class="w-5 h-5"></i><span class="font-black text-xs uppercase tracking-widest">Referencia</span></div>
                                        <div class="bg-indigo-50/50 p-4 rounded-2xl"><p class="text-lg font-black text-indigo-900 mb-1">${ev.scriptureDisplay || ev.scripture || ''}</p></div>
                                    </div>
                                    <div class="bg-rose-50/30 rounded-3xl p-6 border border-rose-100 shadow-sm">
                                        <div class="flex items-center gap-3 mb-4 text-rose-600"><i data-lucide="cross" class="w-5 h-5"></i><span class="font-black text-xs uppercase tracking-widest">Hilos del Evangelio</span></div>
                                        <div class="space-y-3">
                                            ${book.gospelThreads ? book.gospelThreads.map(t => `<div class="flex gap-3 items-start"><div class="w-1.5 h-1.5 bg-rose-300 rounded-full mt-2"></div><p class="text-sm text-slate-700 font-medium">${t}</p></div>`).join('') : ''}
                                        </div>
                                    </div>
                                    <div class="bg-amber-50/30 rounded-3xl p-6 border border-amber-100 shadow-sm">
                                        <div class="flex items-center gap-3 mb-4 text-amber-600"><i data-lucide="lightbulb" class="w-5 h-5"></i><span class="font-black text-xs uppercase tracking-widest">Propósito</span></div>
                                        <p class="text-sm text-slate-700 font-medium italic">${book.authorIntent || ''}</p>
                                    </div>
                                    ${book.genealogies && book.genealogies.length > 0 ? `
                                    <div class="bg-teal-50/30 rounded-3xl p-6 border border-teal-100 shadow-sm">
                                        <div class="flex items-center gap-3 mb-4 text-teal-600"><i data-lucide="users" class="w-5 h-5"></i><span class="font-black text-xs uppercase tracking-widest">Genealogías</span></div>
                                        <div class="space-y-4">
                                            ${book.genealogies.map(gen => `
                                            <div class="bg-white/80 p-4 rounded-2xl border border-teal-50">
                                                <p class="text-sm font-black text-teal-900 mb-1">${gen.title}</p>
                                                <p class="text-xs text-teal-600 font-bold mb-2">${gen.scriptureDisplay}</p>
                                                <p class="text-[11px] text-slate-500 leading-tight">${gen.whyItMatters}</p>
                                            </div>`).join('')}
                                        </div>
                                    </div>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="p-6 bg-slate-50 border-t flex justify-end">
                            <button onclick="closeModal()" class="px-12 py-4 bg-slate-900 text-white rounded-[1.5rem] font-black text-xs uppercase tracking-[0.2em] hover:bg-black transition-all shadow-xl">Concluir Estudio</button>
                        </div>
                    </div>
                </div>
            `;
            rootElement.insertAdjacentHTML('beforeend', modalHTML);
        }

        // --- CONTROLADORES ---
        function setViewMode(mode) {
            state.viewMode = mode;
            window.scrollTo(0, 0);
            renderApp();
        }

        function changeBook(index) {
            if (index < 0 || index >= window.bibleData.length) return;
            state.activeBookIndex = index;
            state.viewMode = 'book';
            window.scrollTo(0, 0);
            renderApp();
        }

        function openModal(eventId) {
            for (let book of window.bibleData) {
                const ev = book.events.find(e => e.id === eventId);
                if (ev) {
                    state.selectedEvent = ev;
                    renderApp();
                    return;
                }
            }
        }

        function closeModal() {
            state.selectedEvent = null;
            renderApp();
        }

        function jumpToEvent(bookIdx, eventId) {
            state.activeBookIndex = bookIdx;
            state.viewMode = 'book';
            openModal(eventId);
        }

        // Simulación de Generación de Imagen (Para estructura)
        async function generateImage(eventId) {
            if (state.isGenerating[eventId]) return;
            state.isGenerating[eventId] = true;
            renderApp();
            
            // Simulación de llamada a API
            console.log("Solicitando imagen para", eventId);
            setTimeout(() => {
                state.isGenerating[eventId] = false;
                // Aquí iría el resultado real de la API
                renderApp();
            }, 2000);
        }
    </script>
</body>
</html>
